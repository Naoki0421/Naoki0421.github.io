<!-- ===============================================
     フォトギャラリー
     陸上競技部の活動写真と動画を掲載

     デザインは全ページ共通の ../stylesheet.css に、
     動きは ../script.js にまとめている。

     写真・動画を追加する場合は <figure> ごと増やすだけでよい。
     枚数に応じて自動で段組みされる。

     ※ img と video には必ず実寸（ピクセル）を width / height で書くこと。
       書かないと、読み込むまで高さが 0 として扱われ、スクロール位置が
       途中でずれてしまう。
     =============================================== -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10324f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="宮城県工業高等学校 陸上競技部の活動写真と動画。トラック、フィールド、投てきの練習と大会の様子を掲載しています。"
    />
    <title>ギャラリー｜宮城県工業高等学校 陸上競技部</title>
    <link rel="stylesheet" href="../stylesheet.css?v=1" />
  </head>
  <body>
    <!-- 画面上部に固定されるヘッダー。
         このページは背面が写真ではないので、最初から白背景（is-solid）にする -->
    <header class="site-header is-solid" id="siteHeader">
      <div class="header-inner">
        <a class="site-logo" href="../index.html">
          陸上競技部
          <span>宮城県工業高等学校</span>
        </a>

        <!-- ハンバーガーボタン（スマホ・タブレットのみ表示） -->
        <button
          class="nav-toggle"
          id="navToggle"
          type="button"
          aria-label="メニューを開く"
          aria-expanded="false"
          aria-controls="globalNav"
        >
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>

        <!-- ナビゲーション（PCでは横並び、スマホでは開閉式） -->
        <nav class="global-nav" id="globalNav">
          <ul>
            <li><a href="../index.html">トップ</a></li>
            <li><a href="../rikubusyoukai/index.html">部紹介</a></li>
            <li><a href="./index.html" aria-current="page">ギャラリー</a></li>
            <li><a href="../schedule/index.html">スケジュール</a></li>
            <li><a href="../komonntobuinnyori/index.html">顧問・部員より</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- メニューを開いた時に背後を覆う黒幕（タップで閉じる） -->
    <div class="nav-overlay" id="navOverlay" hidden></div>

    <main>
      <!-- ===== ページの見出し帯 ===== -->
      <div class="page-head">
        <p class="page-head-label">GALLERY</p>
        <h1 class="page-head-title">ギャラリー</h1>
        <p class="page-head-lead">
          練習と大会での、部員たちの姿を集めました。
        </p>
      </div>

      <!-- ===== 写真 ===== -->
      <section class="section" id="photos">
        <div class="container container-wide">
          <p class="section-label">PHOTO</p>
          <h2 class="section-title">フォトギャラリー</h2>

          <div class="photo-grid">
            <figure class="photo-item">
              <img src="./photo/hyoshodai.jpg" width="1477" height="1108" alt="大会の表彰台に立つ部員" loading="lazy" draggable="false" />
              <figcaption>表彰台</figcaption>
            </figure>

            <figure class="photo-item">
              <img src="./photo/track1.png" width="3477" height="1920" alt="トラック競技の走行中の様子" loading="lazy" draggable="false" />
              <figcaption>400mリレー</figcaption>
            </figure>

            <figure class="photo-item">
              <img src="./photo/400m.jpg" width="2976" height="1984" alt="400mを走る部員" loading="lazy" draggable="false" />
              <figcaption>400m</figcaption>
            </figure>

            <figure class="photo-item">
              <img src="./photo/100ｍハードル.jpg" width="2611" height="1741" alt="100mハードルでハードルを越える部員" loading="lazy" draggable="false" />
              <figcaption>100mハードル</figcaption>
            </figure>

            <figure class="photo-item">
              <img src="./photo/マイルリレー.jpg" width="3936" height="2624" alt="マイルリレー（4×400mリレー）を走る部員" loading="lazy" draggable="false" />
              <figcaption>マイルリレー</figcaption>
            </figure>

            <figure class="photo-item">
              <img src="./photo/sansyou.jpg" width="750" height="595" alt="3000m障害の水濠を越える部員" loading="lazy" draggable="false" />
              <figcaption>3000m障害</figcaption>
            </figure>

            <figure class="photo-item">
              <img src="./photo/Ayumu_3000sc%20conv%201.jpeg" width="2222" height="1480" alt="3000m障害を走る部員" loading="lazy" draggable="false" />
              <figcaption>3000m障害</figcaption>
            </figure>

            <figure class="photo-item">
              <img src="./photo/windsprint.jpg" width="3441" height="2778" alt="ウィンドスプリントで流しをかける部員" loading="lazy" draggable="false" />
              <figcaption>ウィンドスプリント</figcaption>
            </figure>

            <figure class="photo-item">
              <img src="./photo/field1.png" width="2532" height="1170" alt="フィールド競技に臨む部員" loading="lazy" draggable="false" />
              <figcaption>高跳び</figcaption>
            </figure>

            <figure class="photo-item">
              <img src="./photo/フィールド三段.png" width="1333" height="588" alt="三段跳の踏み切りの様子" loading="lazy" draggable="false" />
              <figcaption>三段跳</figcaption>
            </figure>

            <figure class="photo-item">
              <img src="./photo/やり投げ.jpg" width="2736" height="1824" alt="やり投げの投てきの様子" loading="lazy" draggable="false" />
              <figcaption>やり投げ</figcaption>
            </figure>
          </div>
        </div>
      </section>

      <!-- ===== 動画 =====
           preload="metadata" にして、動画の中身は再生されるまで
           読み込まないようにしている（通信量の節約）。
           最初の1コマは ../script.js がサムネイルとして表示する。 -->
      <section class="section section-alt" id="movies">
        <div class="container container-wide">
          <p class="section-label">MOVIE</p>
          <h2 class="section-title">ムービーギャラリー</h2>
          <p class="lead lead-center">
            再生ボタンを押すと動画が始まります。
          </p>

          <div class="movie-grid">
            <figure class="movie-item">
              <video
                width="1280"
                height="720"
                muted
                playsinline
                controls
                controlsList="nodownload"
                preload="metadata"
              >
                <source src="./photo/trackrelay.mp4" type="video/mp4" />
                お使いのブラウザは動画タグに対応していません。
              </video>
              <figcaption>トラック競技</figcaption>
            </figure>

            <figure class="movie-item">
              <video
                width="1280"
                height="720"
                muted
                playsinline
                controls
                controlsList="nodownload"
                preload="metadata"
              >
                <source src="./photo/ryousuke_hougan.mp4" type="video/mp4" />
                お使いのブラウザは動画タグに対応していません。
              </video>
              <figcaption>砲丸投げ</figcaption>
            </figure>

            <figure class="movie-item">
              <video
                width="1280"
                height="720"
                muted
                playsinline
                controls
                controlsList="nodownload"
                preload="metadata"
              >
                <source src="./photo/ryousuke_hougan_2.mp4" type="video/mp4" />
                お使いのブラウザは動画タグに対応していません。
              </video>
              <figcaption>円盤投げ</figcaption>
            </figure>

            <figure class="movie-item">
              <video
                width="1280"
                height="720"
                muted
                playsinline
                controls
                controlsList="nodownload"
                preload="metadata"
              >
                <source src="./photo/yamauchi_spear.mp4" type="video/mp4" />
                お使いのブラウザは動画タグに対応していません。
              </video>
              <figcaption>やり投げ</figcaption>
            </figure>

            <figure class="movie-item">
              <video
                width="1920"
                height="1080"
                muted
                playsinline
                controls
                controlsList="nodownload"
                preload="metadata"
              >
                <source src="./photo/三段跳-min.mp4" type="video/mp4" />
                お使いのブラウザは動画タグに対応していません。
              </video>
              <figcaption>三段跳</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="footer-name">陸上競技部</p>
      <p class="footer-school">宮城県工業高等学校</p>

      <nav class="footer-nav">
        <a href="../index.html">トップ</a>
        <a href="../rikubusyoukai/index.html">部紹介</a>
        <a href="./index.html">ギャラリー</a>
        <a href="../schedule/index.html">スケジュール</a>
        <a href="../komonntobuinnyori/index.html">顧問・部員より</a>
      </nav>

      <p class="footer-copy">© 2026 安倍直希・宮城県工業高等学校 情報技術科・陸上競技部</p>
    </footer>

    <script src="../script.js?v=1"></script>
  </body>
</html>
